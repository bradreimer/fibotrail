<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 252" role="img" aria-label="A one-week spike comes first, and trips are the core of version 1" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13">
  <title>A one-week spike comes first, and trips are the core of version 1</title>
  <rect width="760" height="252" rx="13" fill="#F7F3EA"/>
  <text x="24" y="32" font-size="15" font-weight="600" fill="#1D2B2F">A one-week spike comes first, and trips are the core of version 1</text>
  <rect x="24" y="64" width="112" height="88" rx="8" fill="none" fill-opacity="1" stroke="#5C6B6E" stroke-width="1.25"/>
  <text x="80" y="88" text-anchor="middle" font-weight="600" fill="#1D2B2F">Spike</text>
  <text x="80" y="104" text-anchor="middle" font-size="11.5" fill="#4A5A5E">Check Immich</text>
  <text x="80" y="120" text-anchor="middle" font-size="11.5" fill="#4A5A5E">fields, keys,</text>
  <text x="80" y="136" text-anchor="middle" font-size="11.5" fill="#4A5A5E">and time zones</text>
  <rect x="144" y="64" width="112" height="88" rx="8" fill="none" fill-opacity="1" stroke="#5C6B6E" stroke-width="1.25"/>
  <text x="200" y="88" text-anchor="middle" font-weight="600" fill="#1D2B2F">Foundation</text>
  <text x="200" y="104" text-anchor="middle" font-size="11.5" fill="#4A5A5E">Repo and CI,</text>
  <text x="200" y="120" text-anchor="middle" font-size="11.5" fill="#4A5A5E">Docker image,</text>
  <text x="200" y="136" text-anchor="middle" font-size="11.5" fill="#4A5A5E">scanner, DB</text>
  <rect x="264" y="64" width="112" height="88" rx="8" fill="#146560" fill-opacity="0.12" stroke="#146560" stroke-width="2"/>
  <text x="320" y="88" text-anchor="middle" font-weight="600" fill="#1D2B2F">Trips</text>
  <text x="320" y="104" text-anchor="middle" font-size="11.5" fill="#4A5A5E">Detector,</text>
  <text x="320" y="120" text-anchor="middle" font-size="11.5" fill="#4A5A5E">inbox, library</text>
  <text x="320" y="136" text-anchor="middle" font-size="11.5" fill="#4A5A5E">and trip page</text>
  <rect x="384" y="64" width="112" height="88" rx="8" fill="none" fill-opacity="1" stroke="#5C6B6E" stroke-width="1.25"/>
  <text x="440" y="88" text-anchor="middle" font-weight="600" fill="#1D2B2F">Maps</text>
  <text x="440" y="104" text-anchor="middle" font-size="11.5" fill="#4A5A5E">Route maps,</text>
  <text x="440" y="120" text-anchor="middle" font-size="11.5" fill="#4A5A5E">life map, and</text>
  <text x="440" y="136" text-anchor="middle" font-size="11.5" fill="#4A5A5E">boundaries</text>
  <rect x="504" y="64" width="112" height="88" rx="8" fill="none" fill-opacity="1" stroke="#5C6B6E" stroke-width="1.25"/>
  <text x="560" y="88" text-anchor="middle" font-weight="600" fill="#1D2B2F">Collections</text>
  <text x="560" y="104" text-anchor="middle" font-size="11.5" fill="#4A5A5E">Disney parks,</text>
  <text x="560" y="120" text-anchor="middle" font-size="11.5" fill="#4A5A5E">other sets,</text>
  <text x="560" y="136" text-anchor="middle" font-size="11.5" fill="#4A5A5E">and stats</text>
  <rect x="624" y="64" width="112" height="88" rx="8" fill="none" fill-opacity="1" stroke="#5C6B6E" stroke-width="1.25"/>
  <text x="680" y="88" text-anchor="middle" font-weight="600" fill="#1D2B2F">Release</text>
  <text x="680" y="104" text-anchor="middle" font-size="11.5" fill="#4A5A5E">PWA polish,</text>
  <text x="680" y="120" text-anchor="middle" font-size="11.5" fill="#4A5A5E">accessibility,</text>
  <text x="680" y="136" text-anchor="middle" font-size="11.5" fill="#4A5A5E">docs, v1.0</text>
  <path d="M140 152V176" stroke="#5C6B6E" stroke-width="1.25" fill="none"/>
  <path d="M140 176l8 8l-8 8l-8 -8z" fill="#146560" stroke="#146560" stroke-width="1.25"/>
  <text x="140" y="212" text-anchor="middle" font-size="11.5" fill="#1D2B2F">Immich fields</text>
  <text x="140" y="228" text-anchor="middle" font-size="11.5" fill="#1D2B2F">confirmed</text>
  <path d="M380 152V176" stroke="#5C6B6E" stroke-width="1.25" fill="none"/>
  <path d="M380 176l8 8l-8 8l-8 -8z" fill="#146560" stroke="#146560" stroke-width="1.25"/>
  <text x="380" y="212" text-anchor="middle" font-size="11.5" fill="#1D2B2F">Replay test finds</text>
  <text x="380" y="228" text-anchor="middle" font-size="11.5" fill="#1D2B2F">your known trips</text>
  <path d="M736 152V176" stroke="#5C6B6E" stroke-width="1.25" fill="none"/>
  <path d="M736 176l8 8l-8 8l-8 -8z" fill="#146560" stroke="#146560" stroke-width="1.25"/>
  <text x="736" y="212" text-anchor="end" font-size="11.5" fill="#1D2B2F">Version 1.0</text>
  <text x="736" y="228" text-anchor="end" font-size="11.5" fill="#1D2B2F">published</text>
</svg>
