<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-label="Fibotrail reads Immich and keeps its own database" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13">
  <title>Fibotrail reads Immich and keeps its own database</title>
  <rect width="760" height="360" rx="13" fill="#F7F3EA"/>
  <defs>
    <marker id="arch-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5C6B6E"/></marker>
  </defs>
  <text x="24" y="32" font-size="15" font-weight="600" fill="#1D2B2F">Fibotrail reads Immich and keeps its own database</text>
  <rect x="200" y="64" width="352" height="272" rx="8" fill="#146560" fill-opacity="0.12" stroke="#146560" stroke-width="2"/>
  <text x="216" y="88" font-weight="600" fill="#1D2B2F">Fibotrail container</text>
  <rect x="24" y="104" width="128" height="56" rx="8" fill="none" stroke="#5C6B6E" stroke-width="1.25"/>
  <text x="88" y="128" text-anchor="middle" font-weight="600" fill="#1D2B2F">Phone or iPad</text>
  <text x="88" y="144" text-anchor="middle" font-size="11.5" fill="#4A5A5E">Home-screen app</text>
  <rect x="216" y="104" width="144" height="56" rx="8" fill="none" stroke="#5C6B6E" stroke-width="1.25"/>
  <text x="288" y="128" text-anchor="middle" font-weight="600" fill="#1D2B2F">Web server</text>
  <text x="288" y="144" text-anchor="middle" font-size="11.5" fill="#4A5A5E">Serves UI and API</text>
  <rect x="392" y="104" width="144" height="56" rx="8" fill="none" stroke="#5C6B6E" stroke-width="1.25"/>
  <text x="464" y="128" text-anchor="middle" font-weight="600" fill="#1D2B2F">Thumbnail cache</text>
  <text x="464" y="144" text-anchor="middle" font-size="11.5" fill="#4A5A5E">Caches thumbnails</text>
  <rect x="216" y="184" width="144" height="56" rx="8" fill="none" stroke="#5C6B6E" stroke-width="1.25"/>
  <text x="288" y="208" text-anchor="middle" font-weight="600" fill="#1D2B2F">Database</text>
  <text x="288" y="224" text-anchor="middle" font-size="11.5" fill="#4A5A5E">SQLite</text>
  <rect x="392" y="184" width="144" height="56" rx="8" fill="none" stroke="#5C6B6E" stroke-width="1.25"/>
  <text x="464" y="208" text-anchor="middle" font-weight="600" fill="#1D2B2F">Trip detector</text>
  <text x="464" y="224" text-anchor="middle" font-size="11.5" fill="#4A5A5E">Trips and places</text>
  <rect x="392" y="264" width="144" height="56" rx="8" fill="none" stroke="#5C6B6E" stroke-width="1.25"/>
  <text x="464" y="288" text-anchor="middle" font-weight="600" fill="#1D2B2F">Scanner</text>
  <text x="464" y="304" text-anchor="middle" font-size="11.5" fill="#4A5A5E">Incremental scans</text>
  <rect x="640" y="104" width="96" height="216" rx="8" fill="none" stroke="#5C6B6E" stroke-width="1.25"/>
  <text x="688" y="208" text-anchor="middle" font-weight="600" fill="#1D2B2F">Immich</text>
  <text x="688" y="226" text-anchor="middle" font-size="11.5" fill="#4A5A5E">server</text>
  <g fill="none" stroke="#5C6B6E" stroke-width="1.25">
    <path d="M152 132H216" marker-end="url(#arch-arrow)"/>
    <path d="M360 132H392" marker-end="url(#arch-arrow)"/>
    <path d="M536 132H640" marker-end="url(#arch-arrow)"/>
    <path d="M288 160V184" marker-end="url(#arch-arrow)"/>
    <path d="M392 212H360" marker-end="url(#arch-arrow)"/>
    <path d="M464 264V240" marker-end="url(#arch-arrow)"/>
    <path d="M536 292H640" marker-end="url(#arch-arrow)"/>
  </g>
  <text x="176" y="124" text-anchor="middle" font-size="11.5" fill="#4A5A5E">HTTPS</text>
  <text x="596" y="124" text-anchor="middle" font-size="11" fill="#4A5A5E">read-only key</text>
  <text x="216" y="284" font-size="11.5" fill="#4A5A5E">Database and thumbnails</text>
  <text x="216" y="300" font-size="11.5" fill="#4A5A5E">live in the /data volume</text>
</svg>
