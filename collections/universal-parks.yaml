# Universal parks. Each place needs a boundary file in boundaries/ before it can be listed. To add a
# park, export its outline (see README.md), save it as boundaries/<id>.geojson, and add its entry.
id: universal-parks
name: Universal parks
description: Every Universal theme park in the world
rule:
  min_photos: 3        # photos of one trip needed inside a park to count it
  buffer_m: 50         # allowance for GPS error, in meters
places:
  - id: universal-studios-florida
    name: Universal Studios Florida
    group: Universal Orlando Resort
    status: open
    boundary: boundaries/universal-studios-florida.geojson

  - id: islands-of-adventure
    name: "Universal's Islands of Adventure"
    group: Universal Orlando Resort
    status: open
    boundary: boundaries/islands-of-adventure.geojson

  - id: epic-universe
    name: Universal Epic Universe
    group: Universal Orlando Resort
    status: open
    boundary: boundaries/epic-universe.geojson

  - id: universal-studios-hollywood
    name: Universal Studios Hollywood
    group: Universal Studios Hollywood
    status: open
    boundary: boundaries/universal-studios-hollywood.geojson

  - id: universal-studios-japan
    name: Universal Studios Japan
    group: Universal Studios Japan
    status: open
    boundary: boundaries/universal-studios-japan.geojson

  - id: universal-studios-singapore
    name: Universal Studios Singapore
    group: Universal Studios Singapore
    status: open
    boundary: boundaries/universal-studios-singapore.geojson

  # OpenStreetMap names this outline "Universal Beijing Resort". Its edge is the theme park's.
  - id: universal-studios-beijing
    name: Universal Studios Beijing
    group: Universal Beijing Resort
    status: open
    boundary: boundaries/universal-studios-beijing.geojson
