# Disney parks. A place needs a boundary file in boundaries/ before it can be listed, so only the
# parks that have one are active. To add a park, export its outline (see README.md), save it as
# boundaries/<id>.geojson, and uncomment its entry.
id: disney-parks
name: Disney parks
description: Every Disney theme park in the world
rule:
  min_photos: 3        # photos of one trip needed inside a park to count it
  buffer_m: 50         # allowance for GPS error, in meters
places:
  - id: magic-kingdom
    name: Magic Kingdom
    group: Walt Disney World Resort
    status: open
    boundary: boundaries/magic-kingdom.geojson

  # Walt Disney World Resort
  # - {id: epcot, name: EPCOT, group: Walt Disney World Resort, status: open, boundary: boundaries/epcot.geojson}
  # - {id: hollywood-studios, name: "Disney's Hollywood Studios", group: Walt Disney World Resort, status: open, boundary: boundaries/hollywood-studios.geojson}
  # - {id: animal-kingdom, name: "Disney's Animal Kingdom", group: Walt Disney World Resort, status: open, boundary: boundaries/animal-kingdom.geojson}
  # Disneyland Resort
