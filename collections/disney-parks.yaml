# Disney parks. Each place needs a boundary file in boundaries/ before it can be listed. To add a
# park, export its outline (see README.md), save it as boundaries/<id>.geojson, and add its entry.
id: disney-parks
name: Disney parks
description: Every Disney theme park in the world
rule:
  min_photos: 3        # photos of one trip needed inside a park to count it
  buffer_m: 50         # allowance for GPS error, in meters
places:
  - id: magic-kingdom
    name: Magic Kingdom
    group: Walt Disney World Resort
    status: open
    boundary: boundaries/magic-kingdom.geojson

  - id: epcot
    name: EPCOT
    group: Walt Disney World Resort
    status: open
    boundary: boundaries/epcot.geojson

  - id: hollywood-studios
    name: "Disney's Hollywood Studios"
    group: Walt Disney World Resort
    status: open
    boundary: boundaries/hollywood-studios.geojson

  - id: animal-kingdom
    name: "Disney's Animal Kingdom"
    group: Walt Disney World Resort
    status: open
    boundary: boundaries/animal-kingdom.geojson

  - id: disneyland
    name: Disneyland Park
    group: Disneyland Resort
    status: open
    boundary: boundaries/disneyland.geojson

  - id: california-adventure
    name: Disney California Adventure
    group: Disneyland Resort
    status: open
    boundary: boundaries/california-adventure.geojson

  - id: tokyo-disneyland
    name: Tokyo Disneyland
    group: Tokyo Disney Resort
    status: open
    boundary: boundaries/tokyo-disneyland.geojson

  - id: tokyo-disneysea
    name: Tokyo DisneySea
    group: Tokyo Disney Resort
    status: open
    boundary: boundaries/tokyo-disneysea.geojson

  - id: disneyland-paris
    name: Disneyland Park (Paris)
    group: Disneyland Paris
    status: open
    boundary: boundaries/disneyland-paris.geojson

  # Walt Disney Studios Park was renamed Disney Adventure World in 2025.
  - id: disney-adventure-world
    name: Disney Adventure World
    group: Disneyland Paris
    status: open
    boundary: boundaries/disney-adventure-world.geojson

  - id: hong-kong-disneyland
    name: Hong Kong Disneyland
    group: Hong Kong Disneyland Resort
    status: open
    boundary: boundaries/hong-kong-disneyland.geojson

  - id: shanghai-disneyland
    name: Shanghai Disneyland
    group: Shanghai Disney Resort
    status: open
    boundary: boundaries/shanghai-disneyland.geojson
