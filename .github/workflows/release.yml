name: Release

# Intention: pushing a tag such as v0.1.0 publishes that version of the image, and nothing else does.
# Method: refuse a tag that isn't vMAJOR.MINOR.PATCH, that isn't on main, or whose commit has no
# passing CI run. Then build docker/Dockerfile for amd64 and arm64 and push it as ":0.1.0" (the tag
# without the v) and ":latest". The version goes into the image, where /healthz reports it.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write
  actions: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/bradreimer/fibotrail

jobs:
  release:
    name: Check, build, and push
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read the version from the tag
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The tag $tag isn't vMAJOR.MINOR.PATCH, for example v0.1.0."
            exit 1
          fi
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Check that the tagged commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Commit $GITHUB_SHA isn't on main. Tag a commit that was merged."
            exit 1
          fi

      - name: Check that CI passed on the tagged commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          passed="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow CI --commit "$GITHUB_SHA" \
            --status success --json databaseId --jq length)"
          if [ "$passed" -lt 1 ]; then
            echo "::error::CI hasn't passed on $GITHUB_SHA. Wait for it, then push the tag again."
            exit 1
          fi

      # The final image stage runs a command, so the arm64 build needs emulation.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
